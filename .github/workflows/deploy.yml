name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "config/**"
      - ".github/workflows/deploy.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

# One deploy at a time, so two runs cannot push to gh-pages together. Not
# cancel-in-progress: a deploy stopped half-way through its push is worse than a short
# wait. GitHub keeps only the newest pending run, so the last change still wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/dist
          # Replace gh-pages with exactly this build, so a file the site no longer
          # produces (an old _astro/ bundle, a removed page) is deleted rather than left
          # live. Every page on the site is built from main, so nothing else lives there:
          # a tool deployed from its own branch would be wiped by the next deploy from
          # main. Do not switch to keep_files, which conflicts with this, to work around
          # that; merge the tool first.
          force_orphan: true
