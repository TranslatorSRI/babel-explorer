name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "config/**"
      - ".github/workflows/deploy.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

# One deploy at a time, so two runs cannot push to gh-pages together. Not
# cancel-in-progress: a deploy stopped half-way through its push is worse than a short
# wait. GitHub keeps only the newest pending run, so the last change still wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/dist
          # Copy this build over what is already on gh-pages instead of replacing the
          # branch. The NameRes and Autocomplete pages (#23, #24) are live there from
          # their own branches but not yet on main, and force_orphan: true would delete
          # them on the first deploy from main. The cost is that stale files are never
          # removed: once every tool on gh-pages is built from main, restore
          # force_orphan: true (and drop keep_files, which conflicts with it). Tracked
          # in #39, to be done in #24.
          keep_files: true
