name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "config/**"
      - ".github/workflows/deploy.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

# One deploy at a time, so two runs cannot push to gh-pages together. Not
# cancel-in-progress: a deploy stopped half-way through its push is worse than a short
# wait. GitHub keeps only the newest pending run, so the last change still wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Astro 7 needs 22.23.4 or later. check-latest fetches the newest 22.x instead of
          # whichever one the runner image happens to have cached.
          node-version-file: web/.nvmrc
          check-latest: true
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

      # Lets anyone, and live-check.yml, tell which commit is actually being served:
      # this workflow finishes when gh-pages is pushed, before Pages has published it.
      - name: Stamp the build with its commit
        run: echo "$GITHUB_SHA" > web/dist/commit.txt

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/dist
          # Replace gh-pages with exactly this build, so a file the site no longer
          # produces (an old _astro/ bundle, a removed page) is deleted rather than left
          # live. Every page on the site is built from main, so nothing else lives there:
          # a tool deployed from its own branch would be wiped by the next deploy from
          # main. Do not switch to keep_files, which conflicts with this, to work around
          # that; merge the tool first.
          force_orphan: true
