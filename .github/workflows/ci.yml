name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 17 * * 2"  # Tuesdays at 12pm EST (17:00 UTC); 1pm during EDT
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Save only the wheels uv built from source (actionlint-py) in the Actions
          # cache, as setup-uv did by default before v9. Pre-built wheels are as quick
          # to download again as to restore, and a full cache counts against the
          # repository's 10 GB limit, which the npm caches and live-check.yml's
          # Playwright browsers share.
          prune-cache: true
          # One cache entry per job. The key does not include UV_NO_GROUP, so without
          # this the jobs share one entry and whichever saves first decides whether it
          # holds the lint group (and the actionlint-py wheel built from source).
          cache-suffix: ${{ github.job }}
          # Download uv from GitHub Releases, not Astral's mirror (setup-uv's default).
          # required-version lets setup-uv pick a uv newer than the checksums it
          # bundles, and the checksum for that one comes from the mirror as well, so a
          # binary from the mirror would only be checked against the mirror.
          download-from-astral-mirror: false
      - run: uv sync
      # `uv run` uses the ruff pinned in uv.lock, so CI lints with the same version
      # developers have locally. --output-format github annotates the PR diff inline.
      # Paths come from [tool.ruff] in pyproject.toml rather than being repeated here.
      - run: uv run ruff check --output-format github
      - run: uv run ruff format --check
      # Scheduled, workflow_run and workflow_dispatch workflows cannot run from a PR, so
      # this is the only check a change to one gets before merging. It runs the
      # shellcheck and pyflakes from the `lint` group, not whatever the runner image has.
      - run: uv run actionlint

  test:
    runs-on: ubuntu-latest
    env:
      # Skip the `lint` group: building actionlint-py downloads its binary from GitHub.
      UV_NO_GROUP: lint
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # See the lint job for all three.
          prune-cache: true
          cache-suffix: ${{ github.job }}
          download-from-astral-mirror: false
      - run: uv sync
      - run: uv run pytest -v -m "not integration"

  integration-test:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    env:
      UV_NO_GROUP: lint
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # See the lint job for all three.
          prune-cache: true
          cache-suffix: ${{ github.job }}
          download-from-astral-mirror: false
      - run: uv sync
      - run: uv run pytest -v -m "integration and not slow"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Astro 7 needs 22.23.4 or later. check-latest fetches the newest 22.x instead of
          # whichever one the runner image happens to have cached.
          node-version-file: web/.nvmrc
          check-latest: true
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      # Vitest and the Astro build strip types without checking them.
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web
