name: Live check

# Checks the published site and the NodeNorm and NameRes interfaces it relies on,
# daily and after every deploy, since those services can change under the site without
# any commit here. See "Live checks" in web/tests/README.md.
#
# A failure is reported only by GitHub's failed-workflow email, which for a scheduled
# run goes to whoever last changed the cron line below. GitHub also disables scheduled
# workflows in a public repository after 60 days with no activity, emailing a warning
# first; re-enable it from the Actions tab.

on:
  schedule:
    - cron: "0 13 * * *"  # Daily 13:00 UTC; clear of ci.yml (Tue) and update-prefix-map.yml (Mon)
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
  workflow_dispatch:
    inputs:
      site_url:
        description: "Site to test (must end in /)"
        default: "https://translatorsri.github.io/babel-explorer/"

permissions:
  contents: read

env:
  SITE_URL: ${{ inputs.site_url || 'https://translatorsri.github.io/babel-explorer/' }}

jobs:
  api-contract:
    # Not after a deploy: these call NodeNorm and NameRes directly, which a deploy does
    # not change. A deploy that moves an endpoint in config/ has it checked at the next
    # daily run, or sooner from workflow_dispatch.
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run test:live
        working-directory: web

  site:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      # "Deploy to GitHub Pages" completes when it pushes gh-pages; Pages publishes it
      # in a separate run some seconds later. Wait for the deployed commit to be served,
      # so the tests never check (or fail on) the build it replaced.
      - name: Wait for the deploy to go live
        if: github.event_name == 'workflow_run'
        env:
          WANT: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 60); do
            got=$(curl -fsS --max-time 15 "${SITE_URL}commit.txt?t=$(date +%s)" || true)
            [ "$got" = "$WANT" ] && exit 0
            # A later deploy may go live first, or replace this one's Pages build; the
            # site then serves a descendant of WANT, which includes this deploy.
            if [[ "$got" =~ ^[0-9a-f]{40}$ ]]; then
              status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$WANT...$got" --jq .status || true)
              [ "$status" = ahead ] && exit 0
            fi
            sleep 10
          done
          echo "::error::${SITE_URL}commit.txt is '$got' after 10 minutes, not $WANT"
          exit 1
      # SITE_URL (above) points the tests at the published site rather than a local build.
      - run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/reports/
          retention-days: 14
