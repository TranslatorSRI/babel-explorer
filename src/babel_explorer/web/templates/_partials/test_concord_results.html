<p>{{ rows|length }} result{{ "s" if rows|length != 1 else "" }} found.</p>

<div class="mb-2">
  <button class="btn btn-sm btn-outline-secondary" onclick="copyTableAsTSV('results-table')">Copy as TSV</button>
  <a class="btn btn-sm btn-outline-secondary" id="csv-download" href="#">Download CSV</a>
</div>

<div class="table-responsive">
<table class="table table-striped table-sm" id="results-table">
  <thead>
    <tr>
      <th>Source CURIE</th>
      <th>Identifier</th>
      <th>Label</th>
      <th>Biolink Type</th>
    </tr>
  </thead>
  <tbody>
    {% for row in rows %}
    <tr>
      <td>{{ row.source_curie }}</td>
      <td>{{ row.identifier }}</td>
      <td>{{ row.label }}</td>
      <td>{{ row.biolink_type }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
</div>

<script>
(function() {
  const curies = document.getElementById('curies').value.trim().split('\n').filter(Boolean);
  const params = curies.map(c => 'curie=' + encodeURIComponent(c.trim())).join('&');
  const nnUrl = document.getElementById('nodenorm_url');
  let url = '/api/test-concord/csv?' + params;
  if (nnUrl && nnUrl.value) url += '&nodenorm_url=' + encodeURIComponent(nnUrl.value);
  document.getElementById('csv-download').href = url;
})();
</script>
