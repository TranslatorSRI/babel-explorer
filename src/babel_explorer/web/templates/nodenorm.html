{% extends "base.html" %}
{% block title %}NodeNorm - Babel Explorer{% endblock %}
{% block content %}
<h2>NodeNorm Lookup</h2>
<p>Look up normalized identifiers, labels, and biolink types for CURIEs.</p>

<form hx-post="/htmx/nodenorm" hx-target="#results-container" hx-indicator="#loading">
  <div class="mb-3">
    <label for="curies" class="form-label">CURIEs (one per line)</label>
    <textarea class="form-control" id="curies" name="curies" rows="5" placeholder="MONDO:0004979&#10;HP:0000001"></textarea>
  </div>
  <div class="mb-3">
    <label for="nodenorm_select" class="form-label">NodeNorm Instance</label>
    <select class="form-select" id="nodenorm_select" onchange="onNodeNormSelect(this)">
      {% for name, url in nodenorm_urls.items() %}
      <option value="{{ url }}" {% if url == default_url %}selected{% endif %}>{{ name }} ({{ url }})</option>
      {% endfor %}
      <option value="__custom__">Custom URL...</option>
    </select>
  </div>
  <div class="mb-3" id="custom-url-group" style="display:none;">
    <label for="custom_url_input" class="form-label">Custom URL</label>
    <input type="text" class="form-control" id="custom_url_input" placeholder="https://...">
  </div>
  <input type="hidden" id="nodenorm_url" name="nodenorm_url" value="{{ default_url }}">
  <button type="submit" class="btn btn-primary">Look Up</button>
  <span id="loading" class="htmx-indicator">
    <div class="spinner-border spinner-border-sm text-primary ms-2" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </span>
</form>

<div id="results-container" class="mt-4"></div>

<script>
function onNodeNormSelect(sel) {
  var customGroup = document.getElementById('custom-url-group');
  var hidden = document.getElementById('nodenorm_url');
  var customInput = document.getElementById('custom_url_input');
  if (sel.value === '__custom__') {
    customGroup.style.display = '';
    hidden.value = customInput.value;
    customInput.oninput = function() { hidden.value = customInput.value; };
  } else {
    customGroup.style.display = 'none';
    hidden.value = sel.value;
    customInput.oninput = null;
  }
}
</script>
{% endblock %}
