{% extends "base.html" %}
{% block title %}XRefs - Babel Explorer{% endblock %}
{% block content %}
<h2>Cross-References (XRefs)</h2>
<p>Query cross-references from Babel Concord files.</p>
<div class="alert alert-info">
  <strong>Note:</strong> The first query triggers a Parquet file download (~626 MB). This may take a while.
</div>

<form hx-post="/htmx/xrefs" hx-target="#results-container" hx-indicator="#loading">
  <div class="mb-3">
    <label for="curies" class="form-label">CURIEs (one per line)</label>
    <textarea class="form-control" id="curies" name="curies" rows="5" placeholder="MONDO:0004979"></textarea>
  </div>
  <div class="mb-3 form-check">
    <input type="checkbox" class="form-check-input" id="expand" name="expand" value="true">
    <label class="form-check-label" for="expand">Expand (recursively follow all cross-references)</label>
  </div>
  <div class="mb-3 form-check">
    <input type="checkbox" class="form-check-input" id="labels" name="labels" value="true">
    <label class="form-check-label" for="labels">Include labels from NodeNorm</label>
  </div>
  <button type="submit" class="btn btn-primary">Look Up</button>
  <span id="loading" class="htmx-indicator">
    <div class="spinner-border spinner-border-sm text-primary ms-2" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </span>
</form>

<div id="results-container" class="mt-4"></div>
{% endblock %}
